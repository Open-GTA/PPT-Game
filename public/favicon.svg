<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e201d"/>
      <stop offset="100%" stop-color="#0f100e"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#323630" stroke-width="2"/>

  <!-- Inner Presentation Slide Aspect Frame -->
  <rect x="8" y="10" width="48" height="34" rx="6" fill="#131512" stroke="#40453d" stroke-width="1.5"/>

  <!-- Slide Top Bar -->
  <path d="M8 17 H56" stroke="#2a2e28" stroke-width="1"/>
  <circle cx="13" cy="13.5" r="1.5" fill="#f43f5e"/>
  <circle cx="18" cy="13.5" r="1.5" fill="#f59e0b"/>
  <circle cx="23" cy="13.5" r="1.5" fill="#a3e635"/>

  <!-- Play & Score Sparkle in Screen -->
  <path d="M26 21 L38 27.5 L26 34 Z" fill="url(#limeGrad)" filter="url(#glow)"/>

  <!-- Stand / Podium Base -->
  <path d="M28 44 L25 53 H39 L36 44 Z" fill="#2a2e28"/>
  <rect x="20" y="53" width="24" height="3" rx="1.5" fill="url(#limeGrad)"/>
</svg>
